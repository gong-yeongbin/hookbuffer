# 프론트 빌드 → S3 동기화 → CloudFront 무효화. main의 production 환경에서만, 배포 역할(DEPLOY_ROLE_ARN)로.
# 필요한 저장소 variables: DEPLOY_ROLE_ARN, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID (infra/frontend의 terraform output)
name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://hookbuffer.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 공개 범위(LANDING_ONLY)는 코드 상수라 빌드에 환경 변수가 없다
      - run: pnpm --filter frontend build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 assets는 1년 immutable, index.html은 매번 새로 받게 no-cache. 지운 파일은 버킷에서도 지운다
      - name: upload assets
        run: >
          aws s3 sync apps/frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}"
          --delete --exclude index.html
          --cache-control "public, max-age=31536000, immutable"

      - name: upload index.html
        run: >
          aws s3 cp apps/frontend/dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html"
          --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: invalidate
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/" "/index.html"
